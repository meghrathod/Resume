<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <title>Megh Rathod's Resume</title>
</head>

<body style="padding: 0; margin: 0">
    <iframe id="pdf-js-viewer" title="webviewer" frameborder="0"
        style="overflow: hidden; height: 100vh; width: 100%; display: block"></iframe>
    <script>
        const path = window.location.pathname;
        console.log("Current path:", path);

        let pdfFile = '/Resume.pdf';
        if (path === '/on-campus') {
            pdfFile = '/resume-on-campus.pdf';
        }
        console.log("Selected PDF file:", pdfFile);

        const viewerUrl = '/web/viewer.html?file=' + encodeURIComponent(pdfFile) + '#pagemode=none';
        console.log("Viewer URL:", viewerUrl);

        document.getElementById('pdf-js-viewer').src = viewerUrl;
    </script>
</body>

</html>
